status: discontinued
summary: >-
  Bloom's developer surface is fully wound down. The public SDK repositories were
  archived in 2021, the hosted API and documentation hosts no longer resolve, the
  bloom.co domain is listed for sale with a broker, and Bloom HoldCo LLC filed a
  Form 15-12G on 2025-08-14 terminating registration of the BLT token (holders of
  record: none) alongside an 8-K terminating the token Terms & Conditions. The npm
  packages under @bloomprotocol remain installable but are unmaintained.
