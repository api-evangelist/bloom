  source: https://github.com/hellobloom/attestation-kit
- date: '2021-05-14'
  event: >-
    Bulk archival of the public developer surface on GitHub — share-kit and all its
    platform wrappers (react, vue, angular, ios, android, flutter, xamarin,
    reactnative), receive-kit, verify-kit, waci-kit-react, vc, vc-data,
    attestations-lib, tx-service-pub, bloom-starter and bloom-credential-playground
