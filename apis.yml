aid: bloom
name: Bloom
description: >-
  Bloom was a decentralized identity, credit-attestation and verifiable-credentials
  company backed by Pantera Capital, built on Ethereum and IPFS around three products:
  BloomID (identity attestation), BloomIQ (a credit registry) and BloomScore (credit
  risk scoring). Its stated aim was to let traditional and digital-currency lenders
  serve people who cannot obtain a bank account or a credit score, and it announced a
  TransUnion partnership in 2020 for consumer credit monitoring. Bloom is wound down.
  Its integration SDKs were archived on GitHub in 2021, its API, documentation and
  status hosts no longer resolve, bloom.co now redirects to a domain-broker sale
  listing, and Bloom HoldCo LLC filed a Form 15-12G on 2025-08-14 terminating Exchange
  Act registration of its BLT token with holders of record stated as "none". What
  survives is open source: 40 public repositories under github.com/hellobloom and 19
  unmaintained but installable npm packages under the @bloomprotocol scope implementing
  the W3C and DIF decentralized-identity stack (Verifiable Credentials, DIDs,
  Presentation Exchange, Credential Manifest, WACI).
